name: Publish to npm

on:
  # 推送 v* 格式的 tag 时触发（如 v1.0.0）
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    # 需要写权限来创建 GitHub Release
    permissions:
      contents: write
      id-token: write

    steps:
      # 检出代码
      - name: Checkout
        uses: actions/checkout@v4

      # 安装 pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # 安装 Node.js，并配置 npm registry 认证
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      # 安装依赖
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 构建项目
      - name: Build
        run: pnpm build

      # 发布到 npm（使用 provenance 增加安全性）
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          # 需要在 GitHub 仓库 Settings -> Secrets 中添加 NPM_TOKEN
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 自动创建 GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
